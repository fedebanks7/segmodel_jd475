[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedebanks7-segmodel_jd475"
version = "0.1.0"
description = "按结构键把条目聚类，标出图像分割研究员·推理链路的追踪埋点上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fedebanks7" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fedebanks7.github.io"
Repository = "https://github.com/fedebanks7/segmodel_jd475"
Issues = "https://github.com/fedebanks7/segmodel_jd475/issues"

[project.scripts]
segmodel_jd475 = "segmodel_jd475:main"

[tool.setuptools]
py-modules = ["segmodel_jd475"]
